<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%">
  <defs>
    <filter id="card_shadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="958" height="208" x="1" y="1" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Section Title -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0284C7" letter-spacing="1.5">CORE ENGINEERING TRIAD</text>
    <text x="210" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#64748B">// BALANCED TECHNICAL FOUNDATION</text>
  </g>

  <!-- Card 1: Systems & Architecture -->
  <g transform="translate(32, 48)" filter="url(#card_shadow)">
    <rect width="280" height="138" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="4" fill="#0284C7"/>
    <text x="32" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#0F172A">Systems &amp; OS</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0284C7">Low-Level &amp; Kernel Interfaces</text>
    
    <text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• Linux driver development (C, Meson)</text>
    <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• Hardware defect filtering &amp; biometrics</text>
    <text x="20" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• Terminal TUI engines &amp; SQLite WAL</text>
  </g>

  <!-- Card 2: Software Engineering -->
  <g transform="translate(340, 48)" filter="url(#card_shadow)">
    <rect width="280" height="138" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="4" fill="#059669"/>
    <text x="32" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#0F172A">Software Architecture</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#059669">Full-Stack &amp; Enterprise Systems</text>
    
    <text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• High-throughput Go &amp; TypeScript backends</text>
    <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• Graph debt minimization algorithms</text>
    <text x="20" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• Offline-first synchronization &amp; PWAs</text>
  </g>

  <!-- Card 3: Applied AI -->
  <g transform="translate(648, 48)" filter="url(#card_shadow)">
    <rect width="280" height="138" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="4" fill="#7C3AED"/>
    <text x="32" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#0F172A">Applied Intelligence</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#7C3AED">Multimodal &amp; Efficient Inference</text>
    
    <text x="20" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• Bidirectional voice streaming via WebSockets</text>
    <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• Google Gemini Multimodal Live API</text>
    <text x="20" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#475569">• Efficient inference &amp; cost optimization</text>
  </g>
</svg>
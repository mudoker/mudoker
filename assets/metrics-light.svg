<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <rect width="878" height="178" x="1" y="1" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(24, 26)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#0284C7" letter-spacing="1.5">TECHNICAL SIGNAL OVERVIEW</text>
    <text x="210" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#64748B">// ACTIVE REPOSITORIES &amp; LANGUAGE DISTRIBUTION</text>
  </g>

  <!-- Left: Language Breakdown -->
  <g transform="translate(24, 46)">
    <rect width="400" height="110" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <g transform="translate(16, 18)">
      <rect x="0" y="0" width="368" height="10" rx="4" fill="#334155"/>
      <rect x="0" y="0" width="180" height="10" rx="4" fill="#0284C7"/>
      <rect x="182" y="0" width="120" height="10" rx="0" fill="#7C3AED"/>
      <rect x="304" y="0" width="40" height="10" rx="0" fill="#D97706"/>
      <rect x="346" y="0" width="22" height="10" rx="0" fill="#059669"/>
    </g>

    <g transform="translate(16, 48)">
      <!-- Go -->
      <circle cx="4" cy="4" r="4" fill="#0284C7"/>
      <text x="14" y="8" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0F172A">Go</text>
      <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">48% (stream, memoir)</text>

      <!-- TypeScript -->
      <circle cx="124" cy="4" r="4" fill="#7C3AED"/>
      <text x="134" y="8" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0F172A">TypeScript</text>
      <text x="134" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">33% (ledger, dodo)</text>

      <!-- Python / Shell -->

      <circle cx="344" cy="4" r="4" fill="#059669"/>
      <text x="354" y="8" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0F172A">SQL</text>
      <text x="354" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">8% (db schemas)</text>

  <!-- Right: Architecture Metrics -->
  <g transform="translate(444, 46)">
    <rect width="412" height="110" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <g transform="translate(18, 22)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#0F172A">Engineering Tenets</text>
      
      <g transform="translate(0, 16)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#475569">&#8226; Pure home-row keyboard ergonomics with Vim-style modal states</text>
        <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#475569">&#8226; Sub-100ms real-time multimodal audio streaming over WebSockets</text>
        <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#475569">&#8226; Offline-first local data structures with optimistic synchronization</text>
        <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#475569">&#8226; Algorithmic N-party debt graph minimization and cash flow resolution</text>

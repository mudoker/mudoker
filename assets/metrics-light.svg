      <text x="254" y="8" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0F172A">Python/Shell</text>
      <text x="254" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">11% (tooling, daemons)</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <marker id="arrow_blue_light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow_emerald_light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow_amber_light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arrow_purple_light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="878" height="468" x="1" y="1" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- ================= TIER 1: LOCAL TUI WORKSPACE ================= -->
  <g transform="translate(24, 20)">
    <rect width="832" height="195" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="20" y="26" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#0284C7" letter-spacing="1.2">LOCAL TERMINAL WORKSPACE (TUI)</text>
    <text x="280" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">// GO RUNTIME &amp; BUBBLE TEA ENGINE</text>

    <!-- Node 1: User Input Actions -->
    <g transform="translate(20, 44)">
      <rect width="250" height="48" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="125" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">User Input Actions</text>
      <text x="125" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" text-anchor="middle">Vim Navigation (j / k / x / m / :cmd)</text>
    </g>

    <!-- Arrow 1: Input -> Bubble Tea -->
    <line x1="270" y1="68" x2="368" y2="68" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow_blue_light)"/>
    <text x="319" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" text-anchor="middle">Event Loop</text>

    <!-- Node 2: Bubble Tea Engine -->
    <g transform="translate(372, 44)">
      <rect width="440" height="48" rx="6" fill="#F1F5F9" stroke="#0284C7" stroke-width="1.2"/>
      <text x="220" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">Bubble Tea TUI Engine</text>
      <text x="220" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569" text-anchor="middle">Model-Update-View &#8226; State Orchestrator</text>
    </g>

    <!-- Fork Branch: Engine -> Local DB -->
    <path d="M 460 92 L 460 115 L 145 115 L 145 130" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow_emerald_light)"/>
    <text x="290" y="110" font-family="'JetBrains Mono', monospace" font-size="9" fill="#059669" text-anchor="middle">Atomic Write</text>

    <!-- Node 3: Local DB -->
    <g transform="translate(20, 134)">
      <rect width="250" height="46" rx="6" fill="#F1F5F9" stroke="#059669" stroke-width="1"/>
      <text x="125" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Local State Database</text>
      <text x="125" y="36" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#475569" text-anchor="middle">Persistent Storage (data.json)</text>
    </g>

    <!-- Fork Branch: Engine -> Delta Ledger -->
    <line x1="680" y1="92" x2="680" y2="130" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow_amber_light)"/>
    <text x="735" y="112" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D97706" text-anchor="middle">Append Log</text>

    <!-- Node 4: Sync Delta Ledger -->
    <g transform="translate(562, 134)">
      <rect width="250" height="46" rx="6" fill="#F1F5F9" stroke="#D97706" stroke-width="1"/>
      <text x="125" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="middle">Sync Delta Ledger</text>
      <text x="125" y="36" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#475569" text-anchor="middle">Transactional Log (ledger.json)</text>
    </g>
  </g>

  <!-- ================= TIER 2: BACKGROUND DAEMON ================= -->
  <g transform="translate(24, 230)">
    <rect width="832" height="135" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="20" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#7C3AED" letter-spacing="1.2">BACKGROUND SYNC WORKER (DAEMON)</text>
    <text x="300" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">// ASYNC BIDIRECTIONAL RECONCILIATION</text>

    <!-- Node 5: Conflict Resolver -->
    <g transform="translate(20, 42)">
      <rect width="250" height="48" rx="6" fill="#F1F5F9" stroke="#7C3AED" stroke-width="1"/>
      <text x="125" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">Conflict Resolver</text>
      <text x="125" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569" text-anchor="middle">Timestamp &amp; State Deconfliction</text>
    </g>

    <line x1="145" y1="42" x2="145" y2="-12" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow_emerald_light)"/>
    <text x="105" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#059669">Merge Updates</text>

    <line x1="562" y1="66" x2="276" y2="66" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow_purple_light)"/>
    <text x="419" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">Internal Reconcile</text>

    <!-- Node 6: Delta Push Engine -->
    <g transform="translate(562, 42)">
      <rect width="250" height="48" rx="6" fill="#F1F5F9" stroke="#0284C7" stroke-width="1"/>
      <text x="125" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">Delta Push Engine</text>
      <text x="125" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569" text-anchor="middle">Compaction, Dedup &amp; Rate Limiting</text>
    </g>

    <line x1="687" y1="-12" x2="687" y2="38" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow_amber_light)"/>
    <text x="750" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D97706" text-anchor="middle">Poll Deltas</text>
  </g>

  <!-- ================= TIER 3: GOOGLE CLOUD PLATFORM ================= -->
  <g transform="translate(24, 380)">
    <rect width="832" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Node 7: Google Calendar API (v3) -->
    <g transform="translate(20, 14)">
      <rect width="792" height="46" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="396" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Google Calendar API (v3)</text>
      <text x="396" y="37" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" text-anchor="middle">OAuth 2.0 PKCE &#8226; Primary Calendar 2-Way Synchronization</text>
    </g>

    <line x1="145" y1="14" x2="145" y2="-11" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow_purple_light)"/>
    <text x="105" y="0" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7C3AED">Pull Changes</text>

    <line x1="687" y1="-11" x2="687" y2="10" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow_blue_light)"/>
    <text x="755" y="0" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0284C7" text-anchor="middle">Push Event Deltas</text>
  </g>
</svg>